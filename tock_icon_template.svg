<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <!-- Figma Canvas Artboard: Android Adaptive Icon Template -->
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #888888; font-weight: 600; }
      .guide-text { font-family: monospace; font-size: 11px; fill: #D71921; }
    </style>
  </defs>

  <!-- BACKGROUND CANVAS (512x512) -->
  <g transform="translate(30, 30)">
    <text x="0" y="-10" class="label">1. LAYER: boop-background (512 × 512 px)</text>
    <!-- Background Frame -->
    <rect width="512" height="512" fill="#000000" rx="0" />
    <text x="256" y="260" text-anchor="middle" fill="#333333" font-family="monospace" font-size="16">#000000 (Pure OLED Black)</text>
  </g>

  <!-- FOREGROUND CANVAS (512x512) WITH SAFE ZONE GUIDES -->
  <g transform="translate(560, 30)">
    <text x="0" y="-10" class="label">2. LAYER: boop-foreground (512 × 512 px — Transparent)</text>
    <!-- Canvas Outline -->
    <rect width="512" height="512" fill="#0A0A0A" stroke="#333333" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Safe Zone Guide (340x340 px circle) -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="#D71921" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
    <text x="256" y="70" text-anchor="middle" class="guide-text">▲ 340px SAFE ZONE (Keep Artwork Inside) ▲</text>

    <!-- Squircle / Circle OEM Mask Guide -->
    <rect x="86" y="86" width="340" height="340" rx="90" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />

    <!-- Sample Nothing-style Dot Matrix 'B' Graphic -->
    <g fill="#FCFAFE" id="sample-boop-logo">
      <!-- Col 1 -->
      <circle cx="196" cy="180" r="14" />
      <circle cx="196" cy="218" r="14" />
      <circle cx="196" cy="256" r="14" />
      <circle cx="196" cy="294" r="14" />
      <circle cx="196" cy="332" r="14" />
      <!-- Col 2 -->
      <circle cx="234" cy="180" r="14" />
      <circle cx="234" cy="256" r="14" />
      <circle cx="234" cy="332" r="14" />
      <!-- Col 3 -->
      <circle cx="272" cy="180" r="14" />
      <circle cx="272" cy="256" r="14" fill="#D71921" />
      <circle cx="272" cy="332" r="14" />
      <!-- Col 4 -->
      <circle cx="310" cy="218" r="14" />
      <circle cx="310" cy="294" r="14" />
    </g>

    <text x="256" y="470" text-anchor="middle" class="guide-text">Export this layer as SVG (remove guide circle before export)</text>
  </g>
</svg>
